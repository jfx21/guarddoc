[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guarddoc"
version = "0.1.1"
description = "CLI Malware Triage Tool for macOS & Linux"
readme = "README.md"
requires-python = ">=3.11, <3.15"
authors = [
    { name = "Jakub Adamczyk", email = "jfx2121@duck.com" }
]
# Tylko produkcyjne zależności aplikacji
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "python-magic>=0.4.27",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "yara-python>=4.3.0",
    "watchdog>=4.0.0",
]

# Narzędzia deweloperskie i testowe
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "bandit>=1.7.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
guarddoc = "guarddoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guarddoc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
